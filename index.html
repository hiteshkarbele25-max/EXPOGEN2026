<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expogen 2026 Brochure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
    }
    .wrapper {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 8px 12px;
      font-size: 14px;
      background: #111;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header .title {
      font-weight: 600;
    }
    header .hint {
      font-size: 12px;
      opacity: 0.7;
    }
    .viewer {
      flex: 1;
      width: 100%;
      border: none;
      background: #111;
    }
    .fallback {
      padding: 1rem;
      font-size: 14px;
      line-height: 1.5;
    }
    .fallback a {
      color: #4da3ff;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="title">Expogen 2026 – Brochure</div>
      <div class="hint">If it doesn't load, tap “Download PDF” below.</div>
    </header>

    <!-- PDF viewer area -->
    <iframe
      class="viewer"
      src="EXPOGEN-2026.pdf#view=FitH"
      title="Expogen 2026 Brochure"
    ></iframe>

    <!-- Fallback message for devices that refuse to show PDF inline -->
    <div class="fallback">
      If the brochure is not visible above, 
      <a href="EXPOGEN-2026.pdf">click here to download the PDF</a>.
    </div>
  </div>
</body>
</html>
